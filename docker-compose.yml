services:
  postgres-db:
    image: postgres:16-alpine
    container_name: job_platform_postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - django_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.4.0-alpine
    container_name: job-platform-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - django_redis_data:/data

volumes:
  django_postgres_data:
  django_redis_data: