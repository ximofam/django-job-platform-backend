services:
  postgres-db:
    image: postgres:16-alpine
    container_name: job_platform_postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - django_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.4.0-alpine
    container_name: job-platform-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - django_redis_data:/data

  gotify:
    image: gotify/server:2.9
    container_name: gotify
    ports:
      - "${GOTIFY_PORT}:80"
    environment:
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_USER}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_PASSWORD}
    volumes:
      - django_gotify_data:/app/data
    restart: unless-stopped

volumes:
  django_postgres_data:
  django_redis_data:
  django_gotify_data:
